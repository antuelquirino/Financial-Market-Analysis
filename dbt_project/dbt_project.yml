name: market_pipeline
version: '1.0.0'
profile: market_pipeline

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]

clean-targets: ["target", "dbt_packages"]

# Financial assumptions. Every formula reads them from here (see macros/finance.sql).
vars:
  # Annual risk-free rate for Sharpe ratios (approx. 3-month US T-bill), as a fraction.
  risk_free_rate_annual: 0.04
  # Trading sessions per year, used to annualize daily volatility and returns.
  trading_days_per_year: 252
  # Rolling windows, in trading sessions (21 ~ 1 month, 252 ~ 1 year).
  short_window_days: 21
  long_window_days: 252
  # Total-return benchmark. SPY's adjusted close includes dividends, like the
  # stocks' and sector ETFs'; the ^GSPC index does not.
  benchmark_ticker: SPY

models:
  market_pipeline:
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: table

seeds:
  market_pipeline:
    tickers:
      +column_types:
        ticker: string
        name: string
        asset_type: string
        sector: string
        industry: string
        sector_etf: string
